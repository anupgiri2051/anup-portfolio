<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Anup Giri</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="favicon.png">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <canvas id="bg" aria-hidden="true"></canvas>

    <header class="navbar">
        <a href="/" class="brand-logo">
            <img src="logo.png" alt=""><span>Anup Giri</span>
            <span class="brand-badge">Admin</span>
        </a>
        <div class="nav-actions">
            <a href="/" class="btn btn-secondary">View site</a>
            <button id="logout-btn" class="btn btn-secondary" style="display: none;">Logout</button>
        </div>
    </header>

    <!-- Login Modal -->
    <div id="login-modal" class="login-modal-overlay" style="display: flex;">
        <div class="glass-card login-card">
            <div class="section-header" style="text-align: center;">
                <h2>Admin login</h2>
            </div>
            <form id="login-form" class="clean-form">
                <div class="form-group">
                    <label for="admin-email">Admin email</label>
                    <input type="email" id="admin-email" placeholder="you@example.com" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary btn-block">Login</button>
                <button type="button" id="reset-pass" class="link-btn">Forgot password?</button>
                <div id="login-error" class="error-msg" role="alert"></div>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard Main Container -->
    <main id="admin-dashboard" class="admin-container" style="display: none;">

        <!-- Overview -->
        <section class="stats-row" aria-label="Overview">
            <div class="stat-card"><b id="stat-photos">0</b><span>Photos</span></div>
            <div class="stat-card"><b id="stat-messages">0</b><span>Messages</span></div>
            <div class="stat-card accent"><b id="stat-unread">0</b><span>Unread</span></div>
            <div class="stat-card"><b id="stat-visits">0</b><span>Site visits</span></div>
        </section>

        <!-- Site settings -->
        <section class="glass-card">
            <div class="section-header">
                <h2>Site settings</h2>
                <p class="hint">Changes appear on the live site within a few seconds. Leave a field empty to keep the default text.</p>
            </div>
            <form id="settings-form" class="clean-form">
                <div class="form-group">
                    <label for="set-intro">Home page intro</label>
                    <textarea id="set-intro" rows="3" maxlength="400" placeholder="I’m a student from Baglung, Nepal, exploring IT, AI and web development..."></textarea>
                </div>
                <div class="form-row-desktop">
                    <div class="form-group">
                        <label for="set-location">Based in (home page card)</label>
                        <input type="text" id="set-location" maxlength="40" placeholder="Baglung">
                    </div>
                    <div class="form-group">
                        <label for="set-instagram">Instagram link</label>
                        <input type="url" id="set-instagram" placeholder="https://www.instagram.com/your_name/">
                    </div>
                </div>
                <button type="submit" id="settings-btn" class="btn btn-primary">Save settings</button>
                <div id="settings-status" class="status-msg" role="status"></div>
            </form>
        </section>

        <!-- Photo Upload Section -->
        <section class="glass-card">
            <div class="section-header">
                <h2>Add photos</h2>
            </div>
            <form id="upload-form" class="clean-form">
                <div class="form-group">
                    <label for="photo-title">Photo title / base name</label>
                    <input type="text" id="photo-title" placeholder="Enter image title..." maxlength="80" required>
                </div>
                <div class="form-group">
                    <label for="photo-file">Select images (multiple allowed)</label>
                    <input type="file" id="photo-file" accept="image/*" multiple required>
                </div>

                <div id="preview-wrapper" class="preview-container" style="display: none; margin-top: 0.5rem;">
                    <div id="image-preview" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
                </div>

                <button type="submit" id="upload-btn" class="btn btn-primary" style="margin-top: 0.5rem;">
                    Upload photos
                </button>
                <div id="upload-status" class="status-msg" style="margin-top: 0.5rem;" role="status"></div>
            </form>
        </section>

        <!-- Manage Photos Section -->
        <section class="glass-card">
            <div class="section-header">
                <h2>Gallery items</h2>
            </div>
            <div id="admin-gallery-grid" class="gallery-grid"></div>
        </section>

        <!-- Messages Section -->
        <section class="glass-card">
            <div class="section-header">
                <h2>Contact messages</h2>
            </div>
            <div class="toolbar">
                <input type="search" id="msg-search" placeholder="Search messages..." aria-label="Search messages">
                <select id="msg-filter" aria-label="Filter messages">
                    <option value="all">All</option>
                    <option value="unread">Unread only</option>
                </select>
                <button type="button" id="msg-readall" class="btn btn-secondary btn-sm">Mark all read</button>
                <button type="button" id="msg-export" class="btn btn-secondary btn-sm">Export CSV</button>
            </div>
            <div id="messages-container" class="messages-container"></div>
        </section>

    </main>

    <!-- Scripts -->
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
    <script src="admin-fx.js"></script>
</body>
</html>
