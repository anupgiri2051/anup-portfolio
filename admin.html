<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Anup Giri</title>
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --primary-blue: #2563eb;
            --primary-hover: #1d4ed8;
            --danger-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); line-height: 1.6; min-height: 100vh; }
        .ambient-glow { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); width: 600px; height: 600px; background: radial-gradient(circle, rgba(37, 99, 235, 0.18) 0%, rgba(0, 0, 0, 0) 70%); pointer-events: none; z-index: 0; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 8%; background: rgba(9, 13, 22, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .brand-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-light); font-weight: 800; }
        .brand-badge { background: rgba(37, 99, 235, 0.2); border: 1px solid var(--primary-blue); color: #60a5fa; font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; }
        .admin-container { max-width: 1000px; margin: 3rem auto; padding: 0 1.5rem; display: flex; flex-direction: column; gap: 2.5rem; }
        .glass-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 2.2rem; backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .section-badge { color: var(--primary-blue); font-size: 0.8rem; font-weight: 700; letter-spacing: 1.5px; }
        .section-header { margin-bottom: 1.5rem; }
        .clean-form { display: flex; flex-direction: column; gap: 1.2rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-group label { font-size: 0.9rem; color: var(--text-muted); }
        .clean-form input { background: rgba(8, 11, 17, 0.8); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.8rem; color: var(--text-light); outline: none; }
        .clean-form input:focus { border-color: var(--primary-blue); }
        .btn { padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; text-decoration: none; display: inline-block; transition: background 0.3s ease; }
        .btn-primary { background: var(--primary-blue); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: transparent; color: var(--text-light); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.05); }
        .btn-block { width: 100%; margin-top: 0.5rem; }
        .login-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 13, 22, 0.95); backdrop-filter: blur(16px); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-card { width: 100%; max-width: 420px; }
        .text-center { text-align: center; }
        .error-msg { margin-top: 1rem; font-size: 0.85rem; text-align: center; color: var(--danger-red); font-weight: 500; }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
        .admin-card { background: rgba(8, 11, 17, 0.6); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .admin-card img { width: 100%; height: 140px; object-fit: cover; }
        .admin-card-info { padding: 1rem; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; gap: 1rem; }
        .btn-delete { background: rgba(239, 68, 68, 0.15); color: var(--danger-red); border: 1px solid rgba(239, 68, 68, 0.3); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .btn-delete:hover { background: var(--danger-red); color: white; }
        .messages-container { display: flex; flex-direction: column; gap: 1rem; }
        .message-card { background: rgba(8, 11, 17, 0.6); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; }
        .message-header { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 0.6rem; }
        .msg-email { color: var(--primary-blue); font-size: 0.85rem; }
        .msg-date { color: var(--text-muted); font-size: 0.8rem; }
        .preview-container { margin: 0.5rem 0; border: 1px dashed var(--border-color); border-radius: 8px; padding: 1rem; text-align: center; }
        #image-preview { max-width: 100%; max-height: 220px; border-radius: 8px; }
        .nav-actions { display: flex; align-items: center; gap: 1rem; }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <!-- Login Authentication Overlay -->
    <div id="login-overlay" class="login-modal-overlay">
        <div class="glass-card login-card">
            <div class="section-header text-center">
                <span class="section-badge">ADMIN PORTAL</span>
                <h2 style="margin-top: 0.4rem;">Sign In</h2>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.3rem;">Enter your Login ID and Password to continue.</p>
            </div>
            
            <form id="login-form" class="clean-form">
                <div class="form-group">
                    <label for="admin-id">Login ID</label>
                    <input type="text" id="admin-id" placeholder="Enter Login ID" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" placeholder="Enter Password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Login</button>
                <p id="login-error" class="error-msg"></p>
            </form>
        </div>
    </div>

    <!-- Protected Admin Dashboard Content -->
    <div id="admin-dashboard-content" style="display: none;">
        <header class="navbar">
            <a href="index.html" class="brand-logo">
                <span class="brand-name">ANUP GIRI</span>
                <span class="brand-badge">ADMIN</span>
            </a>
            <div class="nav-actions">
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
                <a href="index.html" class="btn btn-primary">View Live Site</a>
            </div>
        </header>

        <main class="admin-container">
            <!-- Upload Gallery Photo Section -->
            <section class="glass-card upload-section">
                <div class="section-header">
                    <span class="section-badge">GALLERY MANAGEMENT</span>
                    <h2>Upload Photo File</h2>
                </div>

                <form id="upload-form" class="clean-form">
                    <div class="form-group">
                        <label for="photo-title">Photo Title</label>
                        <input type="text" id="photo-title" placeholder="e.g., Project Showcase" required>
                    </div>

                    <div class="form-group">
                        <label for="photo-file">Select Image File</label>
                        <input type="file" id="photo-file" accept="image/*" required>
                    </div>

                    <div id="preview-box" class="preview-container" style="display: none;">
                        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem;">Selected Image Preview:</p>
                        <img id="image-preview" src="" alt="Preview">
                    </div>

                    <button type="submit" class="btn btn-primary" id="submit-btn">Upload & Publish</button>
                    <p id="upload-status" style="font-size: 0.9rem; font-weight: 500;"></p>
                </form>
            </section>

            <!-- Uploaded Photos Grid -->
            <section class="glass-card manage-section">
                <div class="section-header">
                    <span class="section-badge">CURRENT GALLERY</span>
                    <h2>Uploaded Gallery Photos</h2>
                </div>
                
                <div id="admin-photos-grid" class="admin-grid">
                    <p style="color: var(--text-muted);">Loading gallery items...</p>
                </div>
            </section>

            <!-- Received Messages Section -->
            <section class="glass-card inbox-section">
                <div class="section-header">
                    <span class="section-badge">INBOX</span>
                    <h2>Received Contact Messages</h2>
                </div>

                <div id="admin-messages-list" class="messages-container">
                    <p style="color: var(--text-muted);">Loading messages...</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <!-- App Scripts -->
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
