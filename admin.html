<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anup Giri — Admin</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <header class="navbar">
        <a href="/" class="brand-logo">
            <span>Anup Giri</span>
            <span class="brand-badge">Admin</span>
        </a>
        <div class="nav-actions">
            <a href="/" class="btn btn-secondary">View site</a>
            <button id="logout-btn" class="btn btn-secondary" style="display: none;">Logout</button>
        </div>
    </header>

    <!-- Login Modal -->
    <div id="login-modal" class="login-modal-overlay" style="display: flex;">
        <div class="glass-card login-card">
            <div class="section-header" style="text-align: center;">
                <h2>Admin login</h2>
            </div>
            <form id="login-form" class="clean-form">
                <div class="form-group">
                    <label for="admin-email">Admin ID</label>
                    <input type="text" id="admin-email" placeholder="Enter Admin ID" required>
                </div>
                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
                <div id="login-error" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard Main Container -->
    <main id="admin-dashboard" class="admin-container" style="display: none;">

        <!-- Photo Upload Section -->
        <section class="glass-card">
            <div class="section-header">
                <h2>Add photos</h2>
            </div>
            <form id="upload-form" class="clean-form">
                <div class="form-group">
                    <label for="photo-title">Photo title / base name</label>
                    <input type="text" id="photo-title" placeholder="Enter image title..." required>
                </div>
                <div class="form-group">
                    <label for="photo-file">Select images (multiple allowed)</label>
                    <input type="file" id="photo-file" accept="image/*" multiple required>
                </div>

                <div id="preview-wrapper" class="preview-container" style="display: none; margin-top: 0.5rem;">
                    <div id="image-preview" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
                </div>

                <button type="submit" id="upload-btn" class="btn btn-primary" style="margin-top: 0.5rem;">
                    Upload photos
                </button>
                <div id="upload-status" class="status-msg" style="margin-top: 0.5rem;"></div>
            </form>
        </section>

        <!-- Manage Photos Section -->
        <section class="glass-card">
            <div class="section-header">
                <h2>Gallery items</h2>
            </div>
            <div id="admin-gallery-grid" class="gallery-grid"></div>
        </section>

        <!-- Messages Section -->
        <section class="glass-card">
            <div class="section-header">
                <h2>Contact messages</h2>
            </div>
            <div id="messages-container" class="messages-container"></div>
        </section>

    </main>

    <!-- Scripts -->
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
