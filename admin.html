<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Anup Giri</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Auth Modal Styling */
        .auth-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(9, 13, 22, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .auth-card {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .error-text {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>
<body class="admin-body">

    <div class="ambient-glow"></div>

    <!-- Login Modal -->
    <div id="auth-overlay" class="auth-overlay">
        <div class="glass-card auth-card">
            <div class="card-title" style="justify-content: center;">
                <span class="icon">🔒</span>
                <h3>Admin Login</h3>
            </div>
            <form id="login-form" style="margin-top: 1rem;">
                <input type="text" id="admin-user" placeholder="Username" required>
                <input type="password" id="admin-pass" placeholder="Password" required>
                <button type="submit" class="btn btn-primary">Login to Control Center</button>
                <p id="login-error" class="error-text">Invalid username or password!</p>
            </form>
        </div>
    </div>

    <!-- Protected Admin Panel -->
    <div id="admin-content" style="display: none;">
        <header class="navbar">
            <div class="logo">Admin<span>.Core</span></div>
            <div>
                <a href="index.html" class="btn btn-secondary" style="margin-right: 0.5rem;">← View Live Site</a>
                <button id="logout-btn" class="btn btn-secondary" style="color: #ef4444; border-color: rgba(239,68,68,0.3);">Logout</button>
            </div>
        </header>

        <main class="admin-container">
            <div class="admin-grid">
                
                <!-- Upload Photo -->
                <div class="glass-card">
                    <div class="card-title">
                        <span class="icon">📷</span>
                        <h3>Publish Photo</h3>
                    </div>
                    <form id="add-photo-form">
                        <input type="text" id="photo-title" placeholder="Photo Title" required>
                        <input type="url" id="photo-url" placeholder="Image URL (Unsplash / Imgur)" required>
                        <button type="submit" class="btn btn-primary">Upload to Cloud</button>
                    </form>
                    <h4 class="sub-title">Live Gallery Items</h4>
                    <div id="admin-photos-list" class="mini-grid"></div>
                </div>

                <!-- Upload Vlog -->
                <div class="glass-card">
                    <div class="card-title">
                        <span class="icon">🎬</span>
                        <h3>Publish Vlog</h3>
                    </div>
                    <form id="publish-vlog-form">
                        <input type="text" id="vlog-title" placeholder="Vlog Title" required>
                        <input type="url" id="vlog-url" placeholder="YouTube Link" required>
                        <textarea id="vlog-desc" rows="2" placeholder="Short description..."></textarea>
                        <button type="submit" class="btn btn-primary">Publish Vlog</button>
                    </form>
                    <h4 class="sub-title">Live Published Vlogs</h4>
                    <div id="admin-vlogs-list" class="mini-grid"></div>
                </div>

                <!-- Received Messages -->
                <div class="glass-card">
                    <div class="card-title">
                        <span class="icon">📬</span>
                        <h3>Inbox Messages</h3>
                    </div>
                    <div id="admin-messages-list" class="scroll-list"></div>
                </div>

                <!-- Task Board -->
                <div class="glass-card">
                    <div class="card-title">
                        <span class="icon">⚡</span>
                        <h3>Task Board</h3>
                    </div>
                    <div class="task-input-box">
                        <input type="text" id="new-task-text" placeholder="New task item...">
                        <button id="add-task-btn" class="btn btn-primary">+</button>
                    </div>
                    <ul id="admin-tasks-list" class="task-list"></ul>
                </div>

            </div>
        </main>
    </div>

    <!-- Login Authentication Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const authOverlay = document.getElementById('auth-overlay');
            const adminContent = document.getElementById('admin-content');
            const loginForm = document.getElementById('login-form');
            const loginError = document.getElementById('login-error');
            const logoutBtn = document.getElementById('logout-btn');

            // Check session
            if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                authOverlay.style.display = 'none';
                adminContent.style.display = 'block';
            }

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const user = document.getElementById('admin-user').value.trim();
                const pass = document.getElementById('admin-pass').value.trim();

                if (user === 'admin' && pass === 'meanup') {
                    sessionStorage.setItem('adminLoggedIn', 'true');
                    authOverlay.style.display = 'none';
                    adminContent.style.display = 'block';
                    loginError.style.display = 'none';
                } else {
                    loginError.style.display = 'block';
                }
            });

            logoutBtn.addEventListener('click', () => {
                sessionStorage.removeItem('adminLoggedIn');
                location.reload();
            });
        });
    </script>

    <script type="module" src="admin.js"></script>
</body>
</html>
