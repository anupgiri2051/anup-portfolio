<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Anup Giri</title>
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="ambient-glow"></div>

    <header class="navbar">
        <a href="index.html" class="brand-logo">
            <span class="brand-name">ANUP GIRI</span>
            <span class="brand-badge">ADMIN</span>
        </a>
        <a href="index.html" class="nav-cta">View Live Site</a>
    </header>

    <main class="admin-container">
        <!-- Upload Form Card -->
        <section class="glass-card upload-section">
            <div class="section-header">
                <span class="section-badge">MANAGEMENT</span>
                <h2>Upload Gallery Photo</h2>
            </div>

            <form id="upload-form" class="clean-form">
                <div class="form-group">
                    <label for="photo-title">Photo Title</label>
                    <input type="text" id="photo-title" placeholder="e.g., Technology & Innovation" required>
                </div>

                <div class="form-group">
                    <label for="photo-url">Image Direct URL</label>
                    <input type="url" id="photo-url" placeholder="https://images.unsplash.com/photo-..." required>
                </div>

                <!-- Image Preview Box -->
                <div id="preview-box" class="preview-container" style="display: none;">
                    <p class="preview-label">Image Preview:</p>
                    <img id="image-preview" src="" alt="Preview">
                </div>

                <button type="submit" class="btn btn-primary" id="submit-btn">Publish to Gallery</button>
                <p id="upload-status" class="status-msg"></p>
            </form>
        </section>

        <!-- Manage Existing Photos Section -->
        <section class="glass-card manage-section">
            <div class="section-header">
                <span class="section-badge">CURRENT MEDIA</span>
                <h2>Manage Uploaded Photos</h2>
            </div>
            
            <div id="admin-photos-grid" class="admin-grid">
                <p class="loading-text">Loading admin gallery items...</p>
            </div>
        </section>
    </main>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Configuration & Scripts -->
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
