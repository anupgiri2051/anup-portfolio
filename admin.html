<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Anup Giri</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div class="ambient-glow"></div>

    <header class="navbar">
        <a href="index.html" class="brand-logo">
            <i class="fa-solid fa-code"></i>
            <span>Anup Giri</span>
            <span class="brand-badge">ADMIN</span>
        </a>
        <div class="nav-actions">
            <a href="index.html" class="btn btn-secondary"><i class="fa-solid fa-house"></i> View Site</a>
            <button id="logout-btn" class="btn btn-secondary" style="display: none;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </header>

    <!-- Login Modal -->
    <div id="login-modal" class="login-modal-overlay">
        <div class="glass-card login-card">
            <div class="section-header" style="text-align: center;">
                <span class="section-badge">Restricted Access</span>
                <h2>Admin Login</h2>
            </div>
            <form id="login-form" class="clean-form">
                <div class="form-group">
                    <label for="admin-email"><i class="fa-solid fa-user"></i> Admin ID</label>
                    <input type="text" id="admin-email" placeholder="Enter Admin ID (e.g. admin)" required>
                </div>
                <div class="form-group">
                    <label for="admin-password"><i class="fa-solid fa-key"></i> Password</label>
                    <input type="password" id="admin-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-lock-open"></i> Login</button>
                <div id="login-error" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard Main Screen -->
    <main id="admin-dashboard" class="admin-container" style="display: none;">

        <!-- Photo Upload Section -->
        <section class="glass-card">
            <div class="section-header">
                <span class="section-badge">Upload</span>
                <h2>Add New Photos</h2>
            </div>
            <form id="upload-form" class="clean-form">
                <div class="form-row-desktop">
                    <div class="form-group">
                        <label for="photo-title"><i class="fa-solid fa-heading"></i> Photo Title / Base Name</label>
                        <input type="text" id="photo-title" placeholder="Enter title..." required>
                    </div>
                    <div class="form-group">
                        <label for="photo-file"><i class="fa-solid fa-images"></i> Select Images (Multiple Supported)</label>
                        <input type="file" id="photo-file" accept="image/*" multiple required>
                    </div>
                </div>
                <div id="preview-wrapper" class="preview-container" style="display: none;">
                    <div id="image-preview" style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;"></div>
                </div>
                <button type="submit" id="upload-btn" class="btn btn-primary">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Upload Photos
                </button>
                <div id="upload-status" class="status-msg"></div>
            </form>
        </section>

        <!-- Manage Existing Photos Section -->
        <section class="glass-card">
            <div class="section-header">
                <span class="section-badge">Manage</span>
                <h2>Gallery Items</h2>
            </div>
            <div id="admin-gallery-grid" class="admin-grid"></div>
        </section>

        <!-- Messages Inbox Section -->
        <section class="glass-card">
            <div class="section-header">
                <span class="section-badge">Inbox</span>
                <h2>Contact Messages</h2>
            </div>
            <div id="messages-container" class="messages-container"></div>
        </section>

    </main>

    <!-- Scripts -->
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
